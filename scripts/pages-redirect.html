<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuchtík se přestěhoval</title>
<p>Kuchtík najdeš na <a id="destination" href="https://kuchtik.tancer.cz/">kuchtik.tancer.cz</a>.</p>
<script>
  const destination = new URL(document.getElementById('destination').href);
  destination.search = location.search;
  destination.hash = location.hash;
  document.getElementById('destination').href = destination.href;
  location.replace(destination.href);
</script>
